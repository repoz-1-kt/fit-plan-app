name: Patch FitPlan UI

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fitplan-patch.yml
      - tools/patch-fitplan.js
      - tools/add-backup-tools.js
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply UI patch
        run: |
          node tools/patch-fitplan.js
          node tools/add-backup-tools.js
      - name: Commit patched app
        run: |
          git config user.name "FitPlan Bot"
          git config user.email "actions@github.com"
          git add index.html tools/patch-fitplan.js tools/add-backup-tools.js .github/workflows/fitplan-patch.yml
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Improve food diary and workouts"
            git push origin main
            git branch -f gh-pages HEAD
            git push origin gh-pages --force
          fi
